services:
  db:
    image: postgres:16
    container_name: jobagg-db
    environment:
      # Values come from .env (docker compose reads it automatically)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"   # host:container. 5433 on Windows avoids clashing with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .                  # build the image from the Dockerfile in this folder
    container_name: jobagg-api
    environment:
      # Inside Docker's network the database is reached by its service name "db" on its own
      # port 5432. localhost:5433 (in .env) only works from your machine, not from a container.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections, not just until it starts
    healthcheck:
      # The slim image has no curl, so use Python to call /health (which also checks the database)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

[pytest]
# Lets tests "import app" when run as plain `pytest`, not just `python -m pytest`
pythonpath = .
testpaths = tests
filterwarnings =
    # Starlette's TestClient suggests a package named "httpx2". Not installed: the name is one
    # character off "httpx" and couldn't be verified, which is a typosquatting risk.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
